name: Aura Concern Progression CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "app.py"
      - "admin/progression_routes.py"
      - "services/concern_progression.py"
      - "services/event_emission.py"
      - "services/reported_concern_session_events.py"
      - "scripts/verify_concern_progression_postgres.py"
      - "tests/test_concern_progression.py"
      - "security/access.py"
      - "models.py"
      - "migrations/**"
      - "requirements*.txt"
      - ".github/workflows/concern-progression-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-concern-progression-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile concern progression sources
        run: python -m compileall -q app.py admin/progression_routes.py services/concern_progression.py scripts/verify_concern_progression_postgres.py tests/test_concern_progression.py

      - name: Test concern timeline and progression contract
        run: pytest -q --tb=short tests/test_concern_progression.py

      - name: Ruff concern progression sources
        run: ruff check --output-format=concise admin/progression_routes.py services/concern_progression.py scripts/verify_concern_progression_postgres.py tests/test_concern_progression.py

      - name: Bandit concern progression sources
        run: bandit -q admin/progression_routes.py services/concern_progression.py scripts/verify_concern_progression_postgres.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_progression_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_progression_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_progression_test"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to current head
        run: python -m flask db upgrade

      - name: Verify concern progression reconstruction
        run: python -m scripts.verify_concern_progression_postgres
