name: Aura Wave 1.2 PostgreSQL Downgrade CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/**"
      - ".github/workflows/wave-1-2-postgres-downgrade-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-wave-1-2-downgrade-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  postgres-downgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_downgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_downgrade_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_downgrade_test"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade to Wave 1.2 head
        run: python -m flask db upgrade f24c8d1e6a90

      - name: Downgrade Wave 1.2 schema to production baseline
        run: python -m flask db downgrade d42e7a1c9b50

      - name: Verify d42 baseline after downgrade rehearsal
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          columns = {
              column["name"] for column in inspector.get_columns("vehicle_events")
          }
          envelope_columns = {
              "schema_version",
              "occurred_at",
              "recorded_at",
              "subject_type",
              "subject_id",
              "actor_type",
              "actor_user_id",
              "actor_authority",
              "visibility",
              "previous_state",
              "new_state",
              "progression_direction",
              "correlation_id",
              "causation_id",
              "evidence_refs",
              "correction_of_event_id",
          }
          remaining = envelope_columns & columns
          if remaining:
              raise SystemExit(
                  f"Wave 1.2 envelope columns remained after downgrade: {sorted(remaining)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if version != "d42e7a1c9b50":
              raise SystemExit(f"Unexpected downgraded revision: {version}")

          print("Wave 1.2 PostgreSQL downgrade rehearsal reached d42e7a1c9b50.")
          PY

      - name: Re-upgrade after downgrade rehearsal
        run: python -m flask db upgrade f24c8d1e6a90

      - name: Verify Wave 1.2 head restored
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if version != "f24c8d1e6a90":
              raise SystemExit(f"Unexpected re-upgraded revision: {version}")

          print("Wave 1.2 PostgreSQL downgrade/re-upgrade rehearsal passed.")
          PY
