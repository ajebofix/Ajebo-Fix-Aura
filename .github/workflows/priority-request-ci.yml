name: Aura Wave 2.4D Priority Request CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "priority/**"
      - "services/priority_route_cutover.py"
      - "services/priority_scoring.py"
      - "health/alert_routes.py"
      - "admin/progression_routes.py"
      - "templates/priority/**"
      - "templates/admin/dashboard.html"
      - "migrations/versions/c3e1f6a9d842_add_priority_request_contract.py"
      - "tests/test_priority_request_lifecycle.py"
      - "tests/test_wave_2_4e_closeout.py"
      - ".github/workflows/priority-request-ci.yml"
  push:
    branches:
      - main
    paths:
      - "priority/**"
      - "services/priority_route_cutover.py"
      - "services/priority_scoring.py"
      - "health/alert_routes.py"
      - "admin/progression_routes.py"
      - "templates/priority/**"
      - "templates/admin/dashboard.html"
      - "migrations/versions/c3e1f6a9d842_add_priority_request_contract.py"
      - "tests/test_priority_request_lifecycle.py"
      - "tests/test_wave_2_4e_closeout.py"
      - ".github/workflows/priority-request-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-priority-request-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  priority-request-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: http
      RATE_LIMIT_STORAGE_URI: memory://
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile priority slice
        run: >-
          python -m compileall -q
          priority
          services/priority_route_cutover.py
          services/priority_scoring.py
          health/alert_routes.py
          admin/progression_routes.py
          migrations/versions/c3e1f6a9d842_add_priority_request_contract.py
          tests/test_priority_request_lifecycle.py
          tests/test_wave_2_4e_closeout.py

      - name: Run priority lifecycle and Wave 2.4 closeout tests
        run: >-
          pytest -q --tb=short
          tests/test_priority_request_lifecycle.py
          tests/test_wave_2_4e_closeout.py

      - name: Ruff priority slice
        run: >-
          ruff check --output-format=concise
          priority
          services/priority_route_cutover.py
          services/priority_scoring.py
          health/alert_routes.py
          tests/test_priority_request_lifecycle.py
          tests/test_wave_2_4e_closeout.py
