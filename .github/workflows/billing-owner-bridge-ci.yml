name: Aura Billing Owner Bridge CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "services/billing_client_bridge.py"
      - "services/client_repair_progress.py services/repair_progress.py"
      - "services/repair_progress.py"
      - "services/treatment_action_routes.py"
      - "templates/treatment_actions/repair_progress.html"
      - "templates/treatment_actions/owner_repair_progress.html"
      - "tests/test_client_repair_progress.py"
      - "services/billing_client_routes.py"
      - "templates/billing/owner_vehicle.html"
      - "templates/car_detail.html"
      - "app.py"
      - "tests/test_billing_client_bridge.py"
      - ".github/workflows/billing-owner-bridge-ci.yml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  billing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      RINA_OPENAI_PROVIDER_ENABLED: "false"
      AURA_BILLING_CLIENT_VIEW_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Compile new billing integration
        run: >-
          python -m compileall -q
          services/billing_client_bridge.py
          services/billing_client_routes.py
          services/client_repair_progress.py
          services/repair_progress.py
          services/treatment_action_routes.py
          tests/test_billing_client_bridge.py
          tests/test_client_repair_progress.py
      - name: Run owner billing security and read-only tests
        run: pytest -q --tb=short tests/test_billing_client_bridge.py tests/test_client_repair_progress.py
      - name: Ruff new billing code
        run: >-
          ruff check
          services/billing_client_bridge.py
          services/billing_client_routes.py
          services/client_repair_progress.py
          services/repair_progress.py
          tests/test_billing_client_bridge.py
          tests/test_client_repair_progress.py
      - name: Bandit server boundary
        run: bandit -q -r services/billing_client_bridge.py services/billing_client_routes.py services/client_repair_progress.py
