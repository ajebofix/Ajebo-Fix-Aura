name: Aura Wave 1.4 Evidence Schema CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "evidence/**"
      - "migrations/versions/*.py"
      - "scripts/verify_evidence_schema_postgres.py"
      - "scripts/verify_alembic_head.py"
      - "tests/test_evidence_models.py"
      - ".github/workflows/evidence-schema-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-evidence-schema-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  evidence-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile evidence schema sources
        run: |
          python -m py_compile evidence/__init__.py evidence/models.py
          python -m py_compile migrations/versions/c62f1a4e8d30_add_vehicle_evidence_domain.py
          python -m py_compile scripts/verify_evidence_schema_postgres.py scripts/verify_alembic_head.py

      - name: Run evidence model contract tests
        run: pytest -q tests/test_evidence_models.py

      - name: Lint evidence schema sources
        run: |
          ruff check evidence tests/test_evidence_models.py scripts/verify_evidence_schema_postgres.py scripts/verify_alembic_head.py migrations/versions/c62f1a4e8d30_add_vehicle_evidence_domain.py
          bandit -q -r evidence scripts/verify_evidence_schema_postgres.py scripts/verify_alembic_head.py

      - name: Upgrade fresh PostgreSQL database to current repository head
        run: |
          python -m flask db upgrade
          python scripts/verify_alembic_head.py

      - name: Verify Wave 1.4 evidence schema on current PostgreSQL head
        run: python scripts/verify_evidence_schema_postgres.py

      - name: Rehearse evidence schema downgrade to Wave 1.3 head
        run: python -m flask db downgrade b41d8e3f0a21

      - name: Verify evidence tables are absent after downgrade
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          forbidden = {"vehicle_evidence", "evidence_links", "evidence_extractions"}
          present = forbidden & tables
          if present:
              raise SystemExit(f"Evidence tables survived downgrade: {sorted(present)}")
          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "b41d8e3f0a21":
              raise SystemExit(f"Unexpected downgrade head: {version}")
          print("Wave 1.4 evidence downgrade reached b41d8e3f0a21 cleanly.")
          PY

      - name: Re-upgrade and verify current repository head without reusing synthetic rows
        run: |
          python -m flask db upgrade
          python scripts/verify_alembic_head.py
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          required = {"vehicle_evidence", "evidence_links", "evidence_extractions"}
          missing = required - set(inspector.get_table_names())
          if missing:
              raise SystemExit(f"Evidence tables missing after re-upgrade: {sorted(missing)}")
          print("Wave 1.4 evidence downgrade/re-upgrade rehearsal passed at current repository head.")
          PY
