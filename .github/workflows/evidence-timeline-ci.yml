name: Aura Wave 1.4 Evidence Timeline CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "app.py"
      - "evidence/timeline_routes.py"
      - "services/evidence_timeline.py"
      - "services/concern_progression.py"
      - "security/email_verification.py"
      - "templates/partials/evidence_record.html"
      - "tests/test_evidence_timeline.py"
      - "tests/test_evidence_timeline_routes.py"
      - "tests/test_evidence_record_ui.py"
      - "tests/test_concern_progression.py"
      - "scripts/verify_evidence_timeline_postgres.py"
      - ".github/workflows/evidence-timeline-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-evidence-timeline-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      EVIDENCE_TIMELINE_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile evidence timeline sources
        run: |
          python -m py_compile app.py evidence/timeline_routes.py services/evidence_timeline.py
          python -m py_compile security/email_verification.py
          python -m py_compile \
            tests/test_evidence_timeline.py \
            tests/test_evidence_timeline_routes.py \
            tests/test_evidence_record_ui.py
          python -m py_compile scripts/verify_evidence_timeline_postgres.py

      - name: Test safe timeline projection and progression isolation
        run: |
          pytest -q --tb=short \
            tests/test_evidence_timeline.py \
            tests/test_evidence_timeline_routes.py \
            tests/test_evidence_record_ui.py \
            tests/test_concern_progression.py

      - name: Ruff evidence timeline
        run: |
          ruff check \
            app.py evidence/timeline_routes.py services/evidence_timeline.py \
            security/email_verification.py \
            tests/test_evidence_timeline.py tests/test_evidence_timeline_routes.py \
            tests/test_evidence_record_ui.py \
            scripts/verify_evidence_timeline_postgres.py

      - name: Bandit evidence timeline
        run: |
          bandit -q \
            evidence/timeline_routes.py services/evidence_timeline.py \
            scripts/verify_evidence_timeline_postgres.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      EVIDENCE_TIMELINE_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to current head
        run: |
          python -m flask db upgrade
          python scripts/verify_alembic_head.py

      - name: Verify safe evidence timeline on PostgreSQL
        run: python scripts/verify_evidence_timeline_postgres.py
