name: Aura Gulf Pilot MVP CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "partnerships/**"
      - "templates/admin/gulf_*.html"
      - "tests/test_gulf_pilot_routes.py"
      - "tests/test_partner_*.py"
      - "migrations/versions/3bf9d1e6a225_gulf_pilot_operations.py"
      - "app.py"
      - "templates/base.html"
      - ".github/workflows/gulf-pilot-ci.yml"

permissions:
  contents: read

concurrency:
  group: "gulf-pilot-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  gulf-pilot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "gulf-ci-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: memory://
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1
      AURA_GULF_PILOT_ENABLED: "true"
      AURA_GULF_CAMPAIGN_ACTIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development requirements
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Generate ephemeral field encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - name: Compile all Gulf Python modules
        run: python -m compileall -q partnerships migrations/versions/3bf9d1e6a225_gulf_pilot_operations.py tests/test_gulf_pilot_routes.py
      - name: Run pilot workflows and guard contract tests
        run: >-
          pytest -q --tb=short
          tests/test_gulf_pilot_routes.py
          tests/test_partner_capacity.py
          tests/test_partner_pilot_guards.py
          tests/test_partner_service_duration.py
      - name: Ruff changed Gulf slice
        run: ruff check --output-format=concise partnerships/models.py partnerships/operations.py partnerships/routes.py tests/test_gulf_pilot_routes.py
