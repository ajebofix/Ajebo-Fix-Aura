name: Aura Rina Authority Core CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "services/rina_authority.py"
      - "services/rina_contracts.py"
      - "services/rina_context_resolver.py"
      - "tests/test_rina_authority_core.py"
      - "docs/AURA_WAVE_1_3_RINA_MEMORY_AUTHORITY_DESIGN.md"
      - ".github/workflows/rina-authority-core-ci.yml"
      - "models.py"
      - "security/**"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: "aura-rina-authority-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile Rina authority core
        run: python -m compileall -q services/rina_authority.py services/rina_contracts.py services/rina_context_resolver.py tests/test_rina_authority_core.py

      - name: Test Rina authority and context boundaries
        run: pytest -q --tb=short tests/test_rina_authority_core.py

      - name: Ruff Rina authority core
        run: ruff check services/rina_authority.py services/rina_contracts.py services/rina_context_resolver.py tests/test_rina_authority_core.py

      - name: Bandit Rina authority core
        run: bandit -q -r services/rina_authority.py services/rina_contracts.py services/rina_context_resolver.py

      - name: Verify architecture contract exists
        run: test -s docs/AURA_WAVE_1_3_RINA_MEMORY_AUTHORITY_DESIGN.md
