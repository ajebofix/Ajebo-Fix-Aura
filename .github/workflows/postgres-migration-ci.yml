name: Aura PostgreSQL Migration CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/**"
      - "models.py"
      - "profiles/**"
      - "security/**"
      - "rina/**"
      - "evidence/**"
      - "services/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/postgres-migration-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-postgres-migrations-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Show Alembic heads
        run: python -m flask db heads

      - name: Upgrade fresh PostgreSQL database to head
        run: python -m flask db upgrade

      - name: Verify fresh head and Wave 1.2/1.3/1.4 schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "users", "cars", "car_ownership", "vehicle_events",
              "chat_messages", "conversation_records", "rina_ai_audit_events",
              "vehicle_evidence", "evidence_links", "evidence_extractions",
              "user_sessions", "client_profiles", "profile_audit_events",
              "alembic_version",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Fresh PostgreSQL upgrade missing tables: {sorted(missing)}")

          event_columns = {c["name"] for c in inspector.get_columns("vehicle_events")}
          required_event = {
              "schema_version", "occurred_at", "recorded_at", "subject_type",
              "subject_id", "actor_type", "actor_user_id", "actor_authority",
              "visibility", "previous_state", "new_state",
              "progression_direction", "correlation_id", "causation_id",
              "evidence_refs", "correction_of_event_id",
          }
          if required_event - event_columns:
              raise SystemExit(
                  f"VehicleEvent envelope missing: {sorted(required_event - event_columns)}"
              )

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          required_chat = {"car_id", "conversation_id", "channel", "visibility"}
          if required_chat - chat_columns:
              raise SystemExit(
                  f"Rina chat scope missing: {sorted(required_chat - chat_columns)}"
              )

          record_columns = {
              c["name"] for c in inspector.get_columns("conversation_records")
          }
          required_records = {
              "conversation_id", "visibility", "source", "provenance",
              "verification_state", "client_summary",
          }
          if required_records - record_columns:
              raise SystemExit(
                  "Conversation memory scope missing: "
                  f"{sorted(required_records - record_columns)}"
              )

          audit_columns = {
              c["name"] for c in inspector.get_columns("rina_ai_audit_events")
          }
          required_audit = {
              "request_id", "user_id", "car_id", "authority", "state",
              "outcome", "action_family", "provider", "provider_model",
              "provider_status", "provider_request_id", "evidence_refs",
              "audit_metadata", "created_at",
          }
          if required_audit - audit_columns:
              raise SystemExit(
                  f"Rina audit schema missing: {sorted(required_audit - audit_columns)}"
              )
          prohibited_audit = {
              "prompt", "message", "response", "chain_of_thought",
              "api_key", "secret", "password",
          }
          if prohibited_audit & audit_columns:
              raise SystemExit(
                  "Rina audit table contains prohibited content columns: "
                  f"{sorted(prohibited_audit & audit_columns)}"
              )

          evidence_columns = {
              c["name"] for c in inspector.get_columns("vehicle_evidence")
          }
          required_evidence = {
              "car_id", "uploaded_by_user_id", "evidence_type", "purpose",
              "source_channel", "visibility", "review_status", "storage_provider",
              "storage_state", "object_key", "safe_display_name", "content_type",
              "byte_size", "sha256", "consent_basis", "lawful_purpose",
              "retention_until", "deleted_at", "reviewed_by_user_id",
          }
          if required_evidence - evidence_columns:
              raise SystemExit(
                  f"Wave 1.4 evidence schema missing: {sorted(required_evidence - evidence_columns)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "c62f1a4e8d30":
              raise SystemExit(f"Unexpected PostgreSQL head: {version}")
          print("Fresh PostgreSQL upgrade reached c62f1a4e8d30.")
          PY

      - name: Recreate production-shaped baseline at d42e7a1c9b50
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          PY
          python -m flask db upgrade d42e7a1c9b50

      - name: Verify Wave 1.3/1.4 structures are absent at production baseline
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          if "rina_ai_audit_events" in tables:
              raise SystemExit("Rina AI audit table exists before its migration")
          if {"vehicle_evidence", "evidence_links", "evidence_extractions"} & tables:
              raise SystemExit("Wave 1.4 evidence tables exist at d42 baseline")

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          if {"car_id", "conversation_id", "channel", "visibility"} & chat_columns:
              raise SystemExit("Wave 1.3 ChatMessage fields exist at d42 baseline")

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "d42e7a1c9b50":
              raise SystemExit(f"Unexpected production baseline: {version}")
          print("Production-shaped d42 baseline verified.")
          PY

      - name: Seed legacy memory before Wave 1.3 upgrade
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          now = datetime.utcnow()
          with engine.begin() as connection:
              user_id = connection.execute(
                  text(
                      "INSERT INTO users "
                      "(name, email, phone_number, password_hash, role, is_active, created_at, email_verified_at) "
                      "VALUES ('Legacy Memory User', 'legacy-memory@example.com', '+2348000000191', 'hash', 'user', TRUE, :now, :now) RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              car_id = connection.execute(
                  text(
                      "INSERT INTO cars "
                      "(brand, model, year, vin, current_mileage, created_at, vehicle_identity_source) "
                      "VALUES ('Mercedes-Benz', 'GLE', 2024, 'WDDLEGACYMEM00001', 5000, :now, 'manual') RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              connection.execute(
                  text(
                      "INSERT INTO chat_messages (user_id, role, message, timestamp) "
                      "VALUES (:user_id, 'user', 'legacy unscoped memory', :now)"
                  ),
                  {"user_id": user_id, "now": now},
              )
              connection.execute(
                  text(
                      "INSERT INTO conversation_records "
                      "(user_id, vehicle_id, concern, advisor_summary, status, created_at, updated_at) "
                      "VALUES (:user_id, :car_id, 'legacy concern', 'legacy internal summary', 'logged', :now, :now)"
                  ),
                  {"user_id": user_id, "car_id": car_id, "now": now},
              )
          print("Legacy memory rows seeded without invented Wave 1.3 scope.")
          PY

      - name: Upgrade production-shaped baseline to current head
        run: python -m flask db upgrade

      - name: Verify conservative memory backfill and retained event hardening
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)

          event_columns = {
              c["name"]: c for c in inspector.get_columns("vehicle_events")
          }
          if not event_columns["mileage"]["nullable"]:
              raise SystemExit("VehicleEvent mileage compatibility regressed")
          event_checks = {
              c["name"] for c in inspector.get_check_constraints("vehicle_events")
          }
          required_event_checks = {
              "ck_vehicle_events_actor_type",
              "ck_vehicle_events_actor_authority",
              "ck_vehicle_events_visibility",
              "ck_vehicle_events_progression_direction",
              "ck_vehicle_events_schema_version",
          }
          if required_event_checks - event_checks:
              raise SystemExit(
                  f"Wave 1.2 checks missing: {sorted(required_event_checks - event_checks)}"
              )
          event_indexes = {i["name"] for i in inspector.get_indexes("vehicle_events")}
          if "ix_vehicle_events_timeline_scope" not in event_indexes:
              raise SystemExit("Wave 1.2 timeline index regressed")

          with engine.connect() as connection:
              legacy_chat = connection.execute(
                  text(
                      "SELECT car_id, conversation_id, channel, visibility "
                      "FROM chat_messages WHERE message = 'legacy unscoped memory'"
                  )
              ).one()
              legacy_record = connection.execute(
                  text(
                      "SELECT visibility, provenance, verification_state, client_summary "
                      "FROM conversation_records WHERE concern = 'legacy concern'"
                  )
              ).one()
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if legacy_chat != (None, None, "legacy", "internal"):
              raise SystemExit(f"Unsafe ChatMessage legacy backfill: {legacy_chat!r}")
          if legacy_record != ("internal", "legacy", "unverified", None):
              raise SystemExit(
                  f"Unsafe ConversationRecord legacy backfill: {legacy_record!r}"
              )
          if version != "c62f1a4e8d30":
              raise SystemExit(f"Unexpected upgraded head: {version}")
          print("Wave 1.2 hardening, Wave 1.3 memory, and Wave 1.4 head verified.")
          PY

      - name: Verify Rina memory and AI audit PostgreSQL constraints
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, inspect, text
          from sqlalchemy.exc import IntegrityError

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)

          chat_checks = {c["name"] for c in inspector.get_check_constraints("chat_messages")}
          if {"ck_chat_messages_visibility", "ck_chat_messages_channel"} - chat_checks:
              raise SystemExit("Rina ChatMessage CHECK constraints are missing")

          audit_checks = {
              c["name"] for c in inspector.get_check_constraints("rina_ai_audit_events")
          }
          required_audit_checks = {
              "ck_rina_ai_audit_events_authority",
              "ck_rina_ai_audit_events_state",
              "ck_rina_ai_audit_events_outcome",
              "ck_rina_ai_audit_events_provider_status",
          }
          if required_audit_checks - audit_checks:
              raise SystemExit(
                  f"Rina AI audit CHECKs missing: {sorted(required_audit_checks - audit_checks)}"
              )

          audit_indexes = {
              i["name"] for i in inspector.get_indexes("rina_ai_audit_events")
          }
          required_audit_indexes = {
              "ix_rina_ai_audit_events_user_car_time",
              "ix_rina_ai_audit_events_outcome_time",
          }
          if required_audit_indexes - audit_indexes:
              raise SystemExit(
                  f"Rina AI audit indexes missing: {sorted(required_audit_indexes - audit_indexes)}"
              )

          now = datetime.utcnow()
          with engine.begin() as connection:
              user_id = connection.execute(
                  text(
                      "INSERT INTO users "
                      "(name, email, phone_number, password_hash, role, is_active, created_at, email_verified_at) "
                      "VALUES ('Constraint User', 'constraint-rina@example.com', '+2348000000099', 'hash', 'user', TRUE, :now, :now) RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              car_id = connection.execute(
                  text(
                      "INSERT INTO cars "
                      "(brand, model, year, vin, current_mileage, created_at, vehicle_identity_source) "
                      "VALUES ('Mercedes-Benz', 'E-Class', 2024, 'WDDCI000000000099', 5000, :now, 'manual') RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()

          def must_fail(sql, params, label):
              try:
                  with engine.begin() as connection:
                      connection.execute(text(sql), params)
              except IntegrityError:
                  return
              raise SystemExit(f"{label} bypassed PostgreSQL CHECK constraint")

          must_fail(
              "INSERT INTO chat_messages "
              "(user_id, car_id, conversation_id, role, message, timestamp, channel, visibility) "
              "VALUES (:user_id, :car_id, 'invalid-visibility', 'user', 'test', :now, 'in_app', 'public')",
              {"user_id": user_id, "car_id": car_id, "now": now},
              "invalid chat visibility",
          )
          must_fail(
              "INSERT INTO rina_ai_audit_events "
              "(request_id, user_id, car_id, authority, state, outcome, action_family, provider_status, created_at) "
              "VALUES ('invalid-audit-status', :user_id, :car_id, 'owner', 'answered', 'answered', 'respond', 'mystery', :now)",
              {"user_id": user_id, "car_id": car_id, "now": now},
              "invalid Rina provider status",
          )

          print("Rina memory and audit PostgreSQL constraints verified.")
          PY

      - name: Verify Wave 1.4 evidence PostgreSQL constraints
        run: python scripts/verify_evidence_schema_postgres.py
