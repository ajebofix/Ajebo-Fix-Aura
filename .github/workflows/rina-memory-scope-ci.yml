name: Aura Rina Memory Scope CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/versions/a31c7d2e9f10_scope_rina_memory_records.py"
      - "rina/memory_model_extensions.py"
      - "services/rina_memory_service.py"
      - "services/conversation_logger.py"
      - "services/rina_authority.py"
      - "tests/test_rina_memory_scope.py"
      - "scripts/verify_rina_memory_postgres.py"
      - ".github/workflows/rina-memory-scope-ci.yml"
      - "app.py"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: "aura-rina-memory-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile Wave 1.3 memory scope
        run: >-
          python -m compileall -q
          app.py
          rina/memory_model_extensions.py
          services/rina_memory_service.py
          services/conversation_logger.py
          migrations/versions/a31c7d2e9f10_scope_rina_memory_records.py
          tests/test_rina_memory_scope.py
          scripts/verify_rina_memory_postgres.py

      - name: Test vehicle and visibility memory boundaries
        run: pytest -q --tb=short tests/test_rina_memory_scope.py tests/test_rina_authority_core.py

      - name: Ruff memory scope sources
        run: >-
          ruff check
          rina/memory_model_extensions.py
          services/rina_memory_service.py
          services/conversation_logger.py
          migrations/versions/a31c7d2e9f10_scope_rina_memory_records.py
          tests/test_rina_memory_scope.py
          scripts/verify_rina_memory_postgres.py

      - name: Bandit memory scope services
        run: >-
          bandit -q -r
          rina/memory_model_extensions.py
          services/rina_memory_service.py
          services/conversation_logger.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_rina_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_rina_memory_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_rina_memory_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to Wave 1.3 memory head
        run: python -m flask db upgrade

      - name: Verify PostgreSQL Rina memory isolation
        run: python scripts/verify_rina_memory_postgres.py
