name: Aura Maintenance Intelligence CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "maintenance/**"
      - "migrations/**"
      - "tests/test_maintenance_*.py"
      - ".github/workflows/maintenance-intelligence-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-maintenance-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  maintenance-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile maintenance sources
        run: python -m compileall -q maintenance tests/test_maintenance_*.py

      - name: Test maintenance intelligence contracts
        run: pytest -q --tb=short tests/test_maintenance_*.py

      - name: Ruff maintenance sources
        run: ruff check --output-format=concise maintenance tests/test_maintenance_*.py

      - name: Bandit maintenance sources
        run: bandit -q -r maintenance
