name: Aura Wave 1.4 Evidence Events CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "services/event_emission.py"
      - "evidence/review.py"
      - "migrations/versions/d7e4a9c2f160_add_canonical_evidence_event_contract.py"
      - "tests/test_event_emission.py"
      - "tests/test_evidence_review.py"
      - "tests/test_evidence_events.py"
      - "scripts/verify_evidence_events_postgres.py"
      - ".github/workflows/evidence-events-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-evidence-events-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      EVIDENCE_ADVISOR_REVIEW_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile evidence event sources
        run: |
          python -m py_compile services/event_emission.py evidence/review.py
          python -m py_compile migrations/versions/d7e4a9c2f160_add_canonical_evidence_event_contract.py
          python -m py_compile tests/test_event_emission.py tests/test_evidence_review.py tests/test_evidence_events.py
          python -m py_compile scripts/verify_evidence_events_postgres.py

      - name: Test canonical event and evidence integration
        run: |
          pytest -q --tb=short \
            tests/test_event_emission.py \
            tests/test_evidence_review.py \
            tests/test_evidence_events.py

      - name: Ruff evidence events
        run: |
          ruff check \
            services/event_emission.py evidence/review.py \
            migrations/versions/d7e4a9c2f160_add_canonical_evidence_event_contract.py \
            tests/test_event_emission.py tests/test_evidence_review.py tests/test_evidence_events.py \
            scripts/verify_evidence_events_postgres.py

      - name: Bandit evidence events
        run: |
          bandit -q \
            services/event_emission.py evidence/review.py \
            scripts/verify_evidence_events_postgres.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      EVIDENCE_ADVISOR_REVIEW_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to evidence event head
        run: python -m flask db upgrade

      - name: Rehearse evidence event downgrade
        run: python -m flask db downgrade c62f1a4e8d30

      - name: Re-upgrade PostgreSQL to evidence event head
        run: python -m flask db upgrade

      - name: Verify evidence events and PostgreSQL constraints
        run: python scripts/verify_evidence_events_postgres.py
