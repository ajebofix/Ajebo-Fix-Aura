name: Aura Wave 1.5 Predictive Readiness CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "scripts/audit_predictive_readiness.py"
      - "tests/test_predictive_readiness_audit.py"
      - "docs/AURA_WAVE_1_5_PREDICTIVE_HEALTH_READINESS_ARCHITECTURE.md"
      - "docs/AURA_WAVE_1_5_PREDICTIVE_HEALTH_THREAT_MODEL.md"
      - ".github/workflows/predictive-readiness-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-predictive-readiness-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  readiness-audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements-dev.txt

      - name: Compile readiness auditor
        run: |
          python -m py_compile \
            scripts/audit_predictive_readiness.py \
            tests/test_predictive_readiness_audit.py

      - name: Test read-only and privacy contract
        run: |
          pytest -q --tb=short tests/test_predictive_readiness_audit.py

      - name: Ruff predictive readiness
        run: |
          ruff check \
            scripts/audit_predictive_readiness.py \
            tests/test_predictive_readiness_audit.py

      - name: Bandit predictive readiness
        run: |
          bandit -q scripts/audit_predictive_readiness.py
