name: Aura PostgreSQL Migration CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/**"
      - "models.py"
      - "profiles/**"
      - "security/**"
      - "rina/**"
      - "services/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/postgres-migration-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-postgres-migrations-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Show Alembic heads
        run: python -m flask db heads

      - name: Upgrade fresh PostgreSQL database to head
        run: python -m flask db upgrade

      - name: Verify fresh PostgreSQL head and critical schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "users",
              "cars",
              "car_ownership",
              "vehicle_events",
              "event_audit_logs",
              "vehicle_health_snapshots",
              "vehicle_health_alerts",
              "diagnostic_code_definitions",
              "vehicle_dtcs",
              "chat_messages",
              "conversation_records",
              "user_sessions",
              "client_profiles",
              "profile_audit_events",
              "alembic_version",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Fresh PostgreSQL upgrade missing tables: {sorted(missing)}")

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          expected_chat = {"car_id", "conversation_id", "channel", "visibility"}
          if expected_chat - chat_columns:
              raise SystemExit(
                  f"ChatMessage scope fields missing: {sorted(expected_chat - chat_columns)}"
              )

          record_columns = {
              c["name"] for c in inspector.get_columns("conversation_records")
          }
          expected_records = {
              "conversation_id",
              "visibility",
              "source",
              "provenance",
              "verification_state",
              "client_summary",
          }
          if expected_records - record_columns:
              raise SystemExit(
                  "ConversationRecord scope fields missing: "
                  f"{sorted(expected_records - record_columns)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "a31c7d2e9f10":
              raise SystemExit(f"Unexpected PostgreSQL head: {version}")

          print("Fresh PostgreSQL upgrade reached a31c7d2e9f10.")
          PY

      - name: Recreate production-shaped baseline at d42e7a1c9b50
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          PY
          python -m flask db upgrade d42e7a1c9b50

      - name: Verify production-shaped baseline
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "vehicle_events",
              "chat_messages",
              "conversation_records",
              "client_profiles",
              "profile_audit_events",
              "alembic_version",
          }
          missing = required - tables
          if missing:
              raise SystemExit(
                  f"Production-shaped PostgreSQL baseline missing tables: {sorted(missing)}"
              )

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          if {"car_id", "conversation_id", "channel", "visibility"} & chat_columns:
              raise SystemExit("Wave 1.3 ChatMessage fields exist before their migration")

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "d42e7a1c9b50":
              raise SystemExit(f"Unexpected production-shaped head: {version}")

          print("Production-shaped PostgreSQL baseline verified.")
          PY

      - name: Seed legacy memory before Wave 1.3 upgrade
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          now = datetime.utcnow()
          with engine.begin() as connection:
              user_id = connection.execute(
                  text(
                      "INSERT INTO users "
                      "(name, email, phone_number, password_hash, role, is_active, created_at, email_verified_at) "
                      "VALUES ('Legacy Memory User', 'legacy-memory@example.com', '+2348000000191', 'hash', 'user', TRUE, :now, :now) "
                      "RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              car_id = connection.execute(
                  text(
                      "INSERT INTO cars "
                      "(brand, model, year, vin, current_mileage, created_at, vehicle_identity_source) "
                      "VALUES ('Mercedes-Benz', 'GLE', 2024, 'WDDLEGACYMEM00001', 5000, :now, 'manual') "
                      "RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              connection.execute(
                  text(
                      "INSERT INTO chat_messages (user_id, role, message, timestamp) "
                      "VALUES (:user_id, 'user', 'legacy unscoped memory', :now)"
                  ),
                  {"user_id": user_id, "now": now},
              )
              connection.execute(
                  text(
                      "INSERT INTO conversation_records "
                      "(user_id, vehicle_id, concern, advisor_summary, status, created_at, updated_at) "
                      "VALUES (:user_id, :car_id, 'legacy concern', 'legacy internal summary', 'logged', :now, :now)"
                  ),
                  {"user_id": user_id, "car_id": car_id, "now": now},
              )
          print("Legacy memory rows seeded without inventing Wave 1.3 scope.")
          PY

      - name: Upgrade production-shaped baseline to proposed head
        run: python -m flask db upgrade

      - name: Verify Wave 1.2 event envelope remains hardened
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          event_columns = {
              column["name"]: column
              for column in inspector.get_columns("vehicle_events")
          }
          expected_columns = {
              "schema_version", "occurred_at", "recorded_at", "subject_type",
              "subject_id", "actor_type", "actor_user_id", "actor_authority",
              "visibility", "previous_state", "new_state",
              "progression_direction", "correlation_id", "causation_id",
              "evidence_refs", "correction_of_event_id",
          }
          missing = expected_columns - set(event_columns)
          if missing:
              raise SystemExit(f"VehicleEvent envelope missing columns: {sorted(missing)}")
          if not event_columns["mileage"]["nullable"]:
              raise SystemExit("VehicleEvent mileage must remain nullable")

          check_names = {
              constraint["name"]
              for constraint in inspector.get_check_constraints("vehicle_events")
          }
          required_checks = {
              "ck_vehicle_events_actor_type",
              "ck_vehicle_events_actor_authority",
              "ck_vehicle_events_visibility",
              "ck_vehicle_events_progression_direction",
              "ck_vehicle_events_schema_version",
          }
          if required_checks - check_names:
              raise SystemExit(
                  f"VehicleEvent CHECKs missing: {sorted(required_checks - check_names)}"
              )

          index_names = {i["name"] for i in inspector.get_indexes("vehicle_events")}
          if "ix_vehicle_events_timeline_scope" not in index_names:
              raise SystemExit("VehicleEvent timeline scope index is missing")

          print("Wave 1.2 event hardening remains intact.")
          PY

      - name: Verify Wave 1.3 memory migration and conservative backfill
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          expected_chat = {"car_id", "conversation_id", "channel", "visibility"}
          if expected_chat - chat_columns:
              raise SystemExit(
                  f"Wave 1.3 chat columns missing: {sorted(expected_chat - chat_columns)}"
              )

          record_columns = {
              c["name"] for c in inspector.get_columns("conversation_records")
          }
          expected_records = {
              "conversation_id", "visibility", "source", "provenance",
              "verification_state", "client_summary",
          }
          if expected_records - record_columns:
              raise SystemExit(
                  "Wave 1.3 conversation columns missing: "
                  f"{sorted(expected_records - record_columns)}"
              )

          chat_checks = {
              c["name"] for c in inspector.get_check_constraints("chat_messages")
          }
          expected_chat_checks = {
              "ck_chat_messages_visibility", "ck_chat_messages_channel",
          }
          if expected_chat_checks - chat_checks:
              raise SystemExit(
                  f"Chat CHECKs missing: {sorted(expected_chat_checks - chat_checks)}"
              )

          record_checks = {
              c["name"]
              for c in inspector.get_check_constraints("conversation_records")
          }
          expected_record_checks = {
              "ck_conversation_records_visibility",
              "ck_conversation_records_provenance",
              "ck_conversation_records_verification_state",
          }
          if expected_record_checks - record_checks:
              raise SystemExit(
                  "Conversation CHECKs missing: "
                  f"{sorted(expected_record_checks - record_checks)}"
              )

          chat_indexes = {i["name"] for i in inspector.get_indexes("chat_messages")}
          required_chat_indexes = {
              "ix_chat_messages_user_vehicle_time",
              "ix_chat_messages_conversation_id",
          }
          if required_chat_indexes - chat_indexes:
              raise SystemExit(
                  f"Chat indexes missing: {sorted(required_chat_indexes - chat_indexes)}"
              )

          record_indexes = {
              i["name"] for i in inspector.get_indexes("conversation_records")
          }
          required_record_indexes = {
              "ix_conversation_records_user_vehicle_visibility_time",
              "ix_conversation_records_conversation_id",
          }
          if required_record_indexes - record_indexes:
              raise SystemExit(
                  "Conversation indexes missing: "
                  f"{sorted(required_record_indexes - record_indexes)}"
              )

          with engine.connect() as connection:
              legacy_chat = connection.execute(
                  text(
                      "SELECT car_id, conversation_id, channel, visibility "
                      "FROM chat_messages WHERE message = 'legacy unscoped memory'"
                  )
              ).one()
              legacy_record = connection.execute(
                  text(
                      "SELECT visibility, provenance, verification_state, client_summary "
                      "FROM conversation_records WHERE concern = 'legacy concern'"
                  )
              ).one()
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if legacy_chat != (None, None, "legacy", "internal"):
              raise SystemExit(f"Unsafe legacy ChatMessage backfill: {legacy_chat!r}")
          if legacy_record != ("internal", "legacy", "unverified", None):
              raise SystemExit(
                  f"Unsafe legacy ConversationRecord backfill: {legacy_record!r}"
              )
          if version != "a31c7d2e9f10":
              raise SystemExit(f"Unexpected proposed migration head: {version}")

          print("Wave 1.3 memory scope and conservative legacy backfill verified.")
          PY

      - name: Verify PostgreSQL canonical CHECK enforcement
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import IntegrityError

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          now = datetime.utcnow()
          with engine.begin() as connection:
              user_id = connection.execute(
                  text(
                      "INSERT INTO users "
                      "(name, email, phone_number, password_hash, role, is_active, created_at, email_verified_at) "
                      "VALUES ('Constraint User', 'constraint@example.com', '+2348000000099', 'hash', 'user', TRUE, :now, :now) RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              car_id = connection.execute(
                  text(
                      "INSERT INTO cars "
                      "(brand, model, year, vin, current_mileage, created_at, vehicle_identity_source) "
                      "VALUES ('Mercedes-Benz', 'E-Class', 2024, 'WDDCI000000000099', 5000, :now, 'manual') RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              ownership_id = connection.execute(
                  text(
                      "INSERT INTO car_ownership "
                      "(user_id, car_id, start_date, is_active, care_plan, priority_access) "
                      "VALUES (:user_id, :car_id, :now, TRUE, 'active_monitoring', FALSE) RETURNING id"
                  ),
                  {"user_id": user_id, "car_id": car_id, "now": now},
              ).scalar_one()

          def must_fail(sql, params, label):
              try:
                  with engine.begin() as connection:
                      connection.execute(text(sql), params)
              except IntegrityError:
                  return
              raise SystemExit(f"{label} bypassed PostgreSQL CHECK constraint")

          must_fail(
              "INSERT INTO vehicle_events "
              "(car_id, ownership_id, event_type, title, fingerprint, created_by, is_deleted, created_at, actor_type, visibility) "
              "VALUES (:car_id, :ownership_id, 'concern.reported', 'Invalid actor', 'invalid-actor-test', :user_id, FALSE, :now, 'robot', 'client')",
              {"car_id": car_id, "ownership_id": ownership_id, "user_id": user_id, "now": now},
              "invalid actor_type",
          )
          must_fail(
              "INSERT INTO chat_messages "
              "(user_id, car_id, conversation_id, role, message, timestamp, channel, visibility) "
              "VALUES (:user_id, :car_id, 'invalid-visibility', 'user', 'test', :now, 'in_app', 'public')",
              {"user_id": user_id, "car_id": car_id, "now": now},
              "invalid chat visibility",
          )

          print("PostgreSQL canonical vocabularies are enforced.")
          PY

      - name: Verify JSON behavior remains compatible
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          now = datetime.utcnow()
          with engine.begin() as connection:
              user_id = connection.execute(
                  text(
                      "INSERT INTO users "
                      "(name, email, phone_number, password_hash, role, is_active, created_at, email_verified_at) "
                      "VALUES ('JSON User', 'json-ci@example.com', '+2348000000000', 'hash', 'user', TRUE, :now, :now) RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              car_id = connection.execute(
                  text(
                      "INSERT INTO cars "
                      "(brand, model, year, vin, current_mileage, created_at, vehicle_identity_source) "
                      "VALUES ('Mercedes-Benz', 'C-Class', 2020, 'WDDCI000000000001', 10000, :now, 'manual') RETURNING id"
                  ),
                  {"now": now},
              ).scalar_one()
              ownership_id = connection.execute(
                  text(
                      "INSERT INTO car_ownership "
                      "(user_id, car_id, start_date, is_active, care_plan, priority_access) "
                      "VALUES (:user_id, :car_id, :now, TRUE, 'active_monitoring', FALSE) RETURNING id"
                  ),
                  {"user_id": user_id, "car_id": car_id, "now": now},
              ).scalar_one()
              connection.execute(
                  text(
                      "INSERT INTO vehicle_events "
                      "(car_id, ownership_id, event_type, severity, event_date, title, description, mileage, source, data, fingerprint, created_by, is_deleted, created_at) "
                      "VALUES (:car_id, :ownership_id, 'service', 'low', CURRENT_DATE, 'CI event', 'Migration test', 10000, 'ci', CAST(:data AS JSON), 'postgres-ci-event-0001', :user_id, FALSE, :now)"
                  ),
                  {
                      "car_id": car_id,
                      "ownership_id": ownership_id,
                      "data": '{"source":"postgres-ci","verified":true}',
                      "user_id": user_id,
                      "now": now,
                  },
              )
              payload = connection.execute(
                  text(
                      "SELECT data->>'source' FROM vehicle_events "
                      "WHERE fingerprint = 'postgres-ci-event-0001'"
                  )
              ).scalar_one()

          if payload != "postgres-ci":
              raise SystemExit(f"Unexpected JSON payload value: {payload!r}")
          print("PostgreSQL JSON behavior verified.")
          PY
