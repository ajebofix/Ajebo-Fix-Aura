name: Aura Event Emission PostgreSQL CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "services/event_emission.py"
      - "security/access.py"
      - "scripts/verify_event_emission_postgres.py"
      - "tests/test_event_emission.py"
      - "models.py"
      - "migrations/**"
      - "requirements*.txt"
      - ".github/workflows/event-emission-postgres-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-event-emission-postgres-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  event-emission-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_event_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_event_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_event_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to current head
        run: python -m flask db upgrade

      - name: Verify caller transaction and concurrent idempotency
        run: python scripts/verify_event_emission_postgres.py
