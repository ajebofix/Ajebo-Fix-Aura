name: Prince Pilot Security CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "partnerships/prince_*.py"
      - "tests/test_prince_*.py"
      - "templates/partnerships/prince_operator.html"
      - "static/js/prince_pilot_operator.js"
      - "static/css/prince_pilot.css"
      - "static/css/prince_management.css"
      - "static/js/prince_management.js"
      - "templates/partnerships/prince_management.html"
      - "templates/partnerships/prince_estimate.html"
      - "templates/partnerships/prince_invoice.html"
      - "templates/partnerships/prince_finance.html"
      - "templates/partnerships/prince_clinical.html"
      - "templates/partnerships/prince_receipt_print.html"
      - "templates/partnerships/prince_quotation_print.html"
      - "static/css/prince_quotation_print.css"
      - "static/js/prince_quotation_print.js"
      - "templates/partnerships/prince_staging_login.html"
      - "templates/partnerships/prince_live_login.html"
      - "templates/partnerships/prince_live_staff.html"
      - "templates/partnerships/prince_live_base.html"
      - "templates/partnerships/prince_live_release.html"
      - "templates/partnerships/prince_live_recovery.html"
      - "migrations/versions/a731df4e902b_prince_vehicle_registration_recovery.py"
      - "static/css/prince_live_staff.css"
      - "scripts/prince_seed_synthetic_staging.py"
      - "scripts/prince_optional_staging_rehearsal.py"
      - "scripts/prince_verify_synthetic_staging.py"
      - "railway.json"
      - "migrations/versions/b71e5ca90d24_prince_pilot_isolated_workspace.py"
      - "migrations/versions/c84e91f6b207_prince_job_entry_history.py"
      - "migrations/versions/d390ab6f021c_prince_principal_entry_review.py"
      - "migrations/versions/e7b204ac9d31_prince_job_assignment_ledger.py"
      - "migrations/versions/f12c9e48a620_prince_job_lifecycle.py"
      - "migrations/versions/a91d7c2e450b_prince_estimates.py"
      - "migrations/versions/b82d7f6a109c_prince_customer_authorization.py"
      - "migrations/versions/c93e1f7a204b_prince_invoices.py"
      - "migrations/versions/d04f8a2b615c_prince_payments.py"
      - "migrations/versions/e15a9b3c726d_prince_receipts_reversals.py"
      - "migrations/versions/f26b0c4d837e_prince_clinical_handoff.py"
      - "app.py"
      - ".github/workflows/prince-pilot-ci.yml"

permissions:
  contents: read

concurrency:
  group: prince-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prince-pilot-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: prince-pilot-ci-only-not-production
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: testing
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Generate ephemeral encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - name: Compile Prince pilot modules
        run: python -m compileall -q partnerships/prince_models.py partnerships/prince_routes.py partnerships/prince_access_policy.py partnerships/prince_staging_portal.py partnerships/prince_live_portal.py scripts/prince_provision_live_staff.py scripts/prince_seed_synthetic_staging.py scripts/prince_optional_staging_rehearsal.py scripts/prince_verify_synthetic_staging.py tests/test_prince_staging_portal.py tests/test_prince_live_portal.py tests/test_prince_live_provisioning.py tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py
      - name: Run policy and HTTP authorization tests
        run: pytest -q --tb=short tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py tests/test_prince_staging_portal.py tests/test_prince_live_portal.py tests/test_prince_live_provisioning.py
      - name: Check mobile JavaScript syntax
        run: node --check static/js/prince_pilot_operator.js && node --check static/js/prince_management.js && node --check static/js/prince_quotation_print.js
      - name: Lint Prince pilot code
        run: ruff check --output-format=concise partnerships/prince_models.py partnerships/prince_routes.py partnerships/prince_access_policy.py partnerships/prince_staging_portal.py partnerships/prince_live_portal.py scripts/prince_provision_live_staff.py scripts/prince_seed_synthetic_staging.py scripts/prince_optional_staging_rehearsal.py scripts/prince_verify_synthetic_staging.py tests/test_prince_staging_portal.py tests/test_prince_live_portal.py tests/test_prince_live_provisioning.py tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py

  prince-pilot-postgres:
    name: Prince isolated PostgreSQL migration and API rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prince_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: prince_pilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prince_ci -d prince_pilot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: prince-postgres-ci-not-production
      SQLALCHEMY_DATABASE_URI: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_pilot_ci
      GULF_CI_POSTGRES_URL: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_pilot_ci
      APP_ENV: testing
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Generate temporary encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - name: Apply complete Alembic chain on disposable Postgres
        run: flask db upgrade
      - name: Assert Prince schema and confidentiality columns exist
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          inspector = inspect(create_engine(os.environ["SQLALCHEMY_DATABASE_URI"]))
          names = set(inspector.get_table_names())
          required = {
              "prince_tenants", "prince_memberships", "prince_customers",
              "prince_vehicles", "prince_jobs", "prince_audit_events",
              "prince_job_entries", "prince_entry_reviews", "prince_job_assignments",
              "prince_job_transitions", "prince_estimates", "prince_customer_authorizations", "prince_invoices", "prince_payments",
              "prince_receipts", "prince_payment_reversals",
              "prince_clinical_handoffs", "prince_clinical_withdrawals",
          }
          assert required <= names, f"Missing Prince tables: {required - names}"
          fields = {c["name"] for c in inspector.get_columns("prince_customers")}
          assert {"phone_ciphertext","email_ciphertext","address_ciphertext"} <= fields
          assert {"phone_number", "email", "home_address"}.isdisjoint(fields)
          entry_fields = {c["name"] for c in inspector.get_columns("prince_job_entries")}
          assert {"tenant_id","job_id","category","body","review_state","recorded_by_user_id"} <= entry_fields
          fk_targets = [frozenset(fk["constrained_columns"]) for fk in inspector.get_foreign_keys("prince_job_entries")]
          assert frozenset({"job_id", "tenant_id"}) in fk_targets
          review_fields = {c["name"] for c in inspector.get_columns("prince_entry_reviews")}
          assert {"tenant_id", "job_id", "entry_id", "decision", "basis", "review_note",
                  "reviewed_by_user_id"} <= review_fields
          review_fks = [frozenset(fk["constrained_columns"])
                        for fk in inspector.get_foreign_keys("prince_entry_reviews")]
          assert frozenset({"entry_id", "tenant_id"}) in review_fks
          assign_cols = {col["name"] for col in inspector.get_columns("prince_job_assignments")}
          assert {"tenant_id", "job_id", "previous_user_id", "new_user_id",
                  "changed_by_user_id", "reason"} <= assign_cols
          assign_fks = [frozenset(fk["constrained_columns"])
                        for fk in inspector.get_foreign_keys("prince_job_assignments")]
          assert frozenset({"job_id", "tenant_id"}) in assign_fks
          assert frozenset({"tenant_id", "new_user_id"}) in assign_fks
          lifecycle_cols = {col["name"] for col in inspector.get_columns("prince_job_transitions")}
          assert {"tenant_id", "job_id", "previous_status", "new_status", "reason",
                  "changed_by_user_id", "closure_disposition", "follow_up_plan"} <= lifecycle_cols
          lifecycle_fks = [frozenset(fk["constrained_columns"])
                           for fk in inspector.get_foreign_keys("prince_job_transitions")]
          assert frozenset({"job_id", "tenant_id"}) in lifecycle_fks
          estimate_cols = {col["name"] for col in inspector.get_columns("prince_estimates")}
          assert {"tenant_id", "job_id", "version", "items", "subtotal_kobo", "discount_kobo",
                  "total_kobo", "approved_by_user_id"} <= estimate_cols
          estimate_fks = [frozenset(fk["constrained_columns"])
                          for fk in inspector.get_foreign_keys("prince_estimates")]
          assert frozenset({"job_id", "tenant_id"}) in estimate_fks
          authorization_cols = {col["name"] for col in inspector.get_columns("prince_customer_authorizations")}
          assert {"tenant_id", "job_id", "estimate_version", "sequence", "decision",
                  "channel", "evidence_reference", "total_kobo", "recorded_by_user_id"} <= authorization_cols
          authorization_fks = [frozenset(fk["constrained_columns"])
                               for fk in inspector.get_foreign_keys("prince_customer_authorizations")]
          assert frozenset({"job_id", "tenant_id"}) in authorization_fks
          assert frozenset({"job_id", "estimate_version"}) in authorization_fks
          invoice_cols = {col["name"] for col in inspector.get_columns("prince_invoices")}
          assert {"tenant_id", "job_id", "estimate_version", "authorization_sequence",
                  "items", "total_kobo", "issued_by_user_id"} <= invoice_cols
          invoice_fks = [frozenset(fk["constrained_columns"])
                         for fk in inspector.get_foreign_keys("prince_invoices")]
          assert frozenset({"job_id", "tenant_id"}) in invoice_fks
          assert frozenset({"job_id", "estimate_version", "authorization_sequence"}) in invoice_fks
          payment_cols = {col["name"] for col in inspector.get_columns("prince_payments")}
          assert {"tenant_id", "job_id", "reference", "amount_kobo", "decision",
                  "reported_by_user_id", "reviewed_by_user_id"} <= payment_cols
          payment_fks = [frozenset(fk["constrained_columns"])
                         for fk in inspector.get_foreign_keys("prince_payments")]
          assert frozenset({"job_id", "tenant_id"}) in payment_fks
          assert frozenset({"job_id"}) in payment_fks
          for table in ("prince_receipts", "prince_payment_reversals"):
              fields = {col["name"] for col in inspector.get_columns(table)}
              assert {"id", "payment_id"} <= fields
              fks = inspector.get_foreign_keys(table)
              assert any(fk["referred_table"] == "prince_payments" and fk["constrained_columns"] == ["payment_id"] for fk in fks)
          handoff_fks = [frozenset(fk["constrained_columns"])
                         for fk in inspector.get_foreign_keys("prince_clinical_handoffs")]
          assert frozenset({"job_id", "tenant_id"}) in handoff_fks
          assert any(fk["referred_table"] == "prince_clinical_handoffs" for fk in inspector.get_foreign_keys("prince_clinical_withdrawals"))
          PY
      - name: Run Prince API and mobile authorization tests against disposable Postgres
        env:
          PGOPTIONS: "-c lock_timeout=15000 -c statement_timeout=60000"
          PYTHONUNBUFFERED: "1"
        run: pytest -vv --tb=short -o faulthandler_timeout=90 tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py tests/test_prince_staging_portal.py tests/test_prince_live_portal.py tests/test_prince_live_provisioning.py

      - name: Rehearse exact stage provisioning and private HTTP smoke on a second disposable database
        env:
          APP_ENV: staging
          RAILWAY_PROJECT_ID: 3ed38d6c-6411-4890-861b-70cea583add2
          RAILWAY_ENVIRONMENT_ID: aef601d6-38f3-4d16-99f0-aa908c87b3f2
          PRINCE_STAGING_LOCKDOWN: "true"
          AURA_PRINCE_PILOT_API_ENABLED: "true"
          PRINCE_STAGING_SYNTHETIC_SEED: "true"
          PRINCE_STAGING_GATE_TOKEN: "ci-testing-only-stage-gate-2026-000000"
          PRINCE_DEMO_PRINCIPAL_PASSWORD: "ci-demo-principal-password-2026-do-not-use"
          PRINCE_DEMO_STEPHEN_PASSWORD: "ci-demo-stephen-password-2026-do-not-use"
          PRINCE_DEMO_OPERATOR_A_PASSWORD: "ci-demo-operator-a-password-2026-do-not-use"
          PRINCE_DEMO_OPERATOR_B_PASSWORD: "ci-demo-operator-b-password-2026-do-not-use"
          SQLALCHEMY_DATABASE_URI: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_rehearsal
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine(
              "postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE prince_rehearsal"))
          PY
          python -m flask db upgrade
          python -m scripts.prince_optional_staging_rehearsal
