name: Aura Rina Memory PostgreSQL Downgrade CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/versions/a31c7d2e9f10_scope_rina_memory_records.py"
      - ".github/workflows/rina-memory-postgres-downgrade-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-rina-memory-downgrade-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  postgres-downgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_rina_memory_downgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_rina_memory_downgrade"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_rina_memory_downgrade"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade to Wave 1.3 memory head
        run: python -m flask db upgrade a31c7d2e9f10

      - name: Downgrade memory scope to Wave 1.2 head
        run: python -m flask db downgrade f24c8d1e6a90

      - name: Verify memory fields removed at f24
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          record_columns = {
              c["name"] for c in inspector.get_columns("conversation_records")
          }
          memory_chat = {"car_id", "conversation_id", "channel", "visibility"}
          memory_records = {
              "conversation_id", "visibility", "source", "provenance",
              "verification_state", "client_summary",
          }
          if memory_chat & chat_columns:
              raise SystemExit(
                  f"Wave 1.3 chat fields remained after downgrade: {sorted(memory_chat & chat_columns)}"
              )
          if memory_records & record_columns:
              raise SystemExit(
                  "Wave 1.3 conversation fields remained after downgrade: "
                  f"{sorted(memory_records & record_columns)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "f24c8d1e6a90":
              raise SystemExit(f"Unexpected downgraded revision: {version}")
          print("Wave 1.3 memory downgrade reached f24c8d1e6a90.")
          PY

      - name: Re-upgrade to Wave 1.3 memory head
        run: python -m flask db upgrade a31c7d2e9f10

      - name: Verify Wave 1.3 memory head restored
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          record_columns = {
              c["name"] for c in inspector.get_columns("conversation_records")
          }
          expected_chat = {"car_id", "conversation_id", "channel", "visibility"}
          expected_records = {
              "conversation_id", "visibility", "source", "provenance",
              "verification_state", "client_summary",
          }
          if expected_chat - chat_columns:
              raise SystemExit(
                  f"Chat fields not restored: {sorted(expected_chat - chat_columns)}"
              )
          if expected_records - record_columns:
              raise SystemExit(
                  "Conversation fields not restored: "
                  f"{sorted(expected_records - record_columns)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "a31c7d2e9f10":
              raise SystemExit(f"Unexpected restored revision: {version}")
          print("Wave 1.3 memory PostgreSQL downgrade/re-upgrade rehearsal passed.")
          PY
