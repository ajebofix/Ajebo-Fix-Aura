name: Aura Rina Orchestration PostgreSQL Downgrade CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "migrations/versions/b41d8e3f0a21_add_rina_ai_audit_events.py"
      - ".github/workflows/rina-orchestration-postgres-downgrade-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-rina-orchestration-downgrade-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  postgres-downgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_rina_orchestration_downgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_rina_orchestration_downgrade"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_rina_orchestration_downgrade"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade to Rina orchestration audit head
        run: python -m flask db upgrade b41d8e3f0a21

      - name: Downgrade audit schema to memory-scope head
        run: python -m flask db downgrade a31c7d2e9f10

      - name: Verify audit table removed and memory scope retained
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          if "rina_ai_audit_events" in tables:
              raise SystemExit("Rina audit table remained after downgrade")

          chat_columns = {c["name"] for c in inspector.get_columns("chat_messages")}
          expected_chat = {"car_id", "conversation_id", "channel", "visibility"}
          if expected_chat - chat_columns:
              raise SystemExit(
                  f"Wave 1.3 memory scope regressed: {sorted(expected_chat - chat_columns)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "a31c7d2e9f10":
              raise SystemExit(f"Unexpected downgraded revision: {version}")
          print("Rina orchestration audit downgrade reached a31c7d2e9f10.")
          PY

      - name: Re-upgrade to Rina orchestration audit head
        run: python -m flask db upgrade b41d8e3f0a21

      - name: Verify audit head restored
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["SQLALCHEMY_DATABASE_URI"])
          inspector = inspect(engine)
          if "rina_ai_audit_events" not in set(inspector.get_table_names()):
              raise SystemExit("Rina audit table was not restored")

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          if version != "b41d8e3f0a21":
              raise SystemExit(f"Unexpected restored revision: {version}")
          print("Rina orchestration audit downgrade/re-upgrade rehearsal passed.")
          PY
