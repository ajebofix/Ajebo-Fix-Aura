name: Aura UI & UX Contract CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "templates/**"
      - "static/css/**"
      - "tests/test_ui_control_contracts.py"
      - ".github/workflows/ui-ux-contract-ci.yml"
      - "app.py"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-ui-audit-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      RINA_OPENAI_PROVIDER_ENABLED: "false"
      AURA_BILLING_CLIENT_VIEW_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral profile encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install UI contract dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Check UI contract test syntax
        run: python -m compileall -q tests/test_ui_control_contracts.py
      - name: Test all templates, routes and controls
        run: pytest -q --tb=short tests/test_ui_control_contracts.py
      - name: Lint UI contract tests
        run: ruff check tests/test_ui_control_contracts.py
