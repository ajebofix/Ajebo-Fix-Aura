name: Aura Wave 1.4 Evidence Review CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "evidence/review.py"
      - "evidence/review_routes.py"
      - "tests/test_evidence_review.py"
      - "scripts/verify_evidence_review_postgres.py"
      - ".github/workflows/evidence-review-ci.yml"

permissions:
  contents: read

concurrency:
  group: "aura-evidence-review-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile evidence review sources
        run: |
          python -m py_compile evidence/review.py evidence/review_routes.py
          python -m py_compile tests/test_evidence_review.py scripts/verify_evidence_review_postgres.py

      - name: Test evidence review and concern linkage
        run: pytest -q --tb=short tests/test_evidence_review.py

      - name: Ruff evidence review
        run: |
          ruff check \
            evidence/review.py evidence/review_routes.py \
            tests/test_evidence_review.py scripts/verify_evidence_review_postgres.py

      - name: Bandit evidence review
        run: bandit -q -r evidence/review.py evidence/review_routes.py scripts/verify_evidence_review_postgres.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to Wave 1.4 schema head
        run: python -m flask db upgrade

      - name: Verify evidence review and link on PostgreSQL
        run: python scripts/verify_evidence_review_postgres.py
