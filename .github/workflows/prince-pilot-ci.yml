name: Prince Pilot Security CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "partnerships/prince_*.py"
      - "tests/test_prince_*.py"
      - "templates/partnerships/prince_operator.html"
      - "static/js/prince_pilot_operator.js"
      - "static/css/prince_pilot.css"
      - "templates/partnerships/prince_staging_login.html"
      - "scripts/prince_seed_synthetic_staging.py"
      - "scripts/prince_optional_staging_rehearsal.py"
      - "scripts/prince_verify_synthetic_staging.py"
      - "railway.json"
      - "migrations/versions/b71e5ca90d24_prince_pilot_isolated_workspace.py"
      - "migrations/versions/c84e91f6b207_prince_job_entry_history.py"
      - "migrations/versions/d390ab6f021c_prince_principal_entry_review.py"
      - "app.py"
      - ".github/workflows/prince-pilot-ci.yml"

permissions:
  contents: read

concurrency:
  group: prince-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prince-pilot-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: prince-pilot-ci-only-not-production
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: testing
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Generate ephemeral encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - name: Compile Prince pilot modules
        run: python -m compileall -q partnerships/prince_models.py partnerships/prince_routes.py partnerships/prince_access_policy.py partnerships/prince_staging_portal.py scripts/prince_seed_synthetic_staging.py scripts/prince_optional_staging_rehearsal.py scripts/prince_verify_synthetic_staging.py tests/test_prince_staging_portal.py tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py
      - name: Run policy and HTTP authorization tests
        run: pytest -q --tb=short tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py tests/test_prince_staging_portal.py
      - name: Check mobile JavaScript syntax
        run: node --check static/js/prince_pilot_operator.js
      - name: Lint Prince pilot code
        run: ruff check --output-format=concise partnerships/prince_models.py partnerships/prince_routes.py partnerships/prince_access_policy.py partnerships/prince_staging_portal.py scripts/prince_seed_synthetic_staging.py scripts/prince_optional_staging_rehearsal.py scripts/prince_verify_synthetic_staging.py tests/test_prince_staging_portal.py tests/test_prince_access_policy.py tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py

  prince-pilot-postgres:
    name: Prince isolated PostgreSQL migration and API rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prince_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: prince_pilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prince_ci -d prince_pilot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: prince-postgres-ci-not-production
      SQLALCHEMY_DATABASE_URI: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_pilot_ci
      GULF_CI_POSTGRES_URL: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_pilot_ci
      APP_ENV: testing
      PROFILE_ENCRYPTION_KEY_VERSION: ci-v1
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Generate temporary encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - name: Apply complete Alembic chain on disposable Postgres
        run: flask db upgrade
      - name: Assert Prince schema and confidentiality columns exist
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          inspector = inspect(create_engine(os.environ["SQLALCHEMY_DATABASE_URI"]))
          names = set(inspector.get_table_names())
          required = {
              "prince_tenants", "prince_memberships", "prince_customers",
              "prince_vehicles", "prince_jobs", "prince_audit_events",
              "prince_job_entries", "prince_entry_reviews",
          }
          assert required <= names, f"Missing Prince tables: {required - names}"
          fields = {c["name"] for c in inspector.get_columns("prince_customers")}
          assert {"phone_ciphertext","email_ciphertext","address_ciphertext"} <= fields
          assert {"phone_number", "email", "home_address"}.isdisjoint(fields)
          entry_fields = {c["name"] for c in inspector.get_columns("prince_job_entries")}
          assert {"tenant_id","job_id","category","body","review_state","recorded_by_user_id"} <= entry_fields
          fk_targets = [frozenset(fk["constrained_columns"]) for fk in inspector.get_foreign_keys("prince_job_entries")]
          assert frozenset({"job_id", "tenant_id"}) in fk_targets
          review_fields = {c["name"] for c in inspector.get_columns("prince_entry_reviews")}
          assert {"tenant_id", "job_id", "entry_id", "decision", "basis", "review_note",
                  "reviewed_by_user_id"} <= review_fields
          review_fks = [frozenset(fk["constrained_columns"])
                        for fk in inspector.get_foreign_keys("prince_entry_reviews")]
          assert frozenset({"entry_id", "tenant_id"}) in review_fks
          PY
      - name: Run Prince API and mobile authorization tests against disposable Postgres
        run: pytest -q --tb=short tests/test_prince_pilot_api.py tests/test_prince_pilot_operator_ui.py tests/test_prince_staging_portal.py

      - name: Rehearse exact stage provisioning and private HTTP smoke on a second disposable database
        env:
          APP_ENV: staging
          RAILWAY_PROJECT_ID: 3ed38d6c-6411-4890-861b-70cea583add2
          RAILWAY_ENVIRONMENT_ID: aef601d6-38f3-4d16-99f0-aa908c87b3f2
          PRINCE_STAGING_LOCKDOWN: "true"
          AURA_PRINCE_PILOT_API_ENABLED: "true"
          PRINCE_STAGING_SYNTHETIC_SEED: "true"
          PRINCE_STAGING_GATE_TOKEN: "ci-testing-only-stage-gate-2026-000000"
          PRINCE_DEMO_PRINCIPAL_PASSWORD: "ci-demo-principal-password-2026-do-not-use"
          PRINCE_DEMO_STEPHEN_PASSWORD: "ci-demo-stephen-password-2026-do-not-use"
          PRINCE_DEMO_OPERATOR_A_PASSWORD: "ci-demo-operator-a-password-2026-do-not-use"
          PRINCE_DEMO_OPERATOR_B_PASSWORD: "ci-demo-operator-b-password-2026-do-not-use"
          SQLALCHEMY_DATABASE_URI: postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/prince_rehearsal
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine(
              "postgresql://prince_ci:synthetic_ci_only@127.0.0.1:5432/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE prince_rehearsal"))
          PY
          python -m flask db upgrade
          python -m scripts.prince_optional_staging_rehearsal
