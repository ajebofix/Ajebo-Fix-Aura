name: Aura Rina Orchestration CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "rina/providers/**"
      - "rina/audit_models.py"
      - "services/rina_audit.py"
      - "services/rina_orchestrator.py"
      - "services/rina_provider_context.py"
      - "services/rina_runtime_flags.py"
      - "services/rina_contracts.py"
      - "services/rina_authority.py"
      - "services/rina_context_resolver.py"
      - "services/rina_memory_service.py"
      - "migrations/versions/b41d8e3f0a21_add_rina_ai_audit_events.py"
      - "tests/test_rina_orchestrator.py"
      - "tests/test_rina_openai_provider.py"
      - "scripts/verify_rina_orchestration_postgres.py"
      - ".github/workflows/rina-orchestration-ci.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: "aura-rina-orchestration-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      RINA_OPENAI_PROVIDER_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile orchestration sources
        run: >-
          python -m compileall -q
          rina/providers
          rina/audit_models.py
          services/rina_audit.py
          services/rina_orchestrator.py
          services/rina_provider_context.py
          services/rina_runtime_flags.py
          tests/test_rina_orchestrator.py
          tests/test_rina_openai_provider.py
          scripts/verify_rina_orchestration_postgres.py
          migrations/versions/b41d8e3f0a21_add_rina_ai_audit_events.py

      - name: Test authority, memory, orchestration and OpenAI adapter contracts
        run: >-
          pytest -q --tb=short
          tests/test_rina_authority_core.py
          tests/test_rina_memory_scope.py
          tests/test_rina_orchestrator.py
          tests/test_rina_openai_provider.py

      - name: Ruff orchestration sources
        run: >-
          ruff check
          rina/providers
          rina/audit_models.py
          services/rina_audit.py
          services/rina_orchestrator.py
          services/rina_provider_context.py
          services/rina_runtime_flags.py
          tests/test_rina_orchestrator.py
          tests/test_rina_openai_provider.py
          scripts/verify_rina_orchestration_postgres.py
          migrations/versions/b41d8e3f0a21_add_rina_ai_audit_events.py

      - name: Bandit provider and orchestration boundary
        run: >-
          bandit -q -r
          rina/providers
          rina/audit_models.py
          services/rina_audit.py
          services/rina_orchestrator.py
          services/rina_provider_context.py
          services/rina_runtime_flags.py
          scripts/verify_rina_orchestration_postgres.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: aura
          POSTGRES_DB: aura_rina_orchestration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aura -d aura_rina_orchestration_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://aura:aura@127.0.0.1:5432/aura_rina_orchestration_test"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      RINA_OPENAI_PROVIDER_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Upgrade PostgreSQL to orchestration head
        run: python -m flask db upgrade

      - name: Verify PostgreSQL orchestration and privacy-safe audit
        run: python scripts/verify_rina_orchestration_postgres.py
