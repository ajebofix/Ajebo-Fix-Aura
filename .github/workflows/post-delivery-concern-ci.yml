name: Aura Post-delivery Concern CI

on:
  pull_request:
    paths:
      - "services/reported_concern_capture.py"
      - "admin/routes.py"
      - "routes/chat.py"
      - "services/treatment_action_routes.py"
      - "templates/admin/add_concern.html"
      - "templates/treatment_actions/**"
      - "tests/test_post_delivery_concern_capture.py"
      - ".github/workflows/post-delivery-concern-ci.yml"

permissions:
  contents: read

jobs:
  concern-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: testing
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"
      RINA_OPENAI_PROVIDER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral profile encryption key
        run: python3 scripts/generate_ci_profile_encryption_key.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt
      - name: Compile changed sources
        run: python -m compileall -q services/reported_concern_capture.py admin/routes.py routes/chat.py services/treatment_action_routes.py tests/test_post_delivery_concern_capture.py
      - name: Test new concern recording and canonical history
        run: pytest -q --tb=short tests/test_post_delivery_concern_capture.py tests/test_reported_concern_events.py
      - name: Ruff
        run: ruff check services/reported_concern_capture.py admin/routes.py routes/chat.py services/treatment_action_routes.py tests/test_post_delivery_concern_capture.py
