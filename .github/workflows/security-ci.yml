name: Aura Security CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "aura-security-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SECRET_KEY: "ci-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      APP_ENV: "testing"
      PREFERRED_URL_SCHEME: "http"
      RATE_LIMIT_STORAGE_URI: "memory://"
      PROFILE_ENCRYPTION_KEY: "Xa3TmWWEgrSvl-KCaDY5lYoQHDk4OBsfx60fJXCf_i0="
      PROFILE_ENCRYPTION_KEY_VERSION: "ci-v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements-dev.txt

      - name: Compile changed Python sources
        run: python -m compileall -q app.py models.py auth driver events ownership profiles security services migrations scripts tests

      - name: Rehearse production schema reconciliation
        env:
          SQLALCHEMY_DATABASE_URI: "sqlite:////tmp/aura-schema-drift.db"
        run: |
          rm -f /tmp/aura-schema-drift.db
          python - <<'PY'
          from sqlalchemy import text

          from app import create_app
          from extensions import db
          from profiles.models import ClientProfile, ProfileAuditEvent

          app = create_app()
          with app.app_context():
              db.create_all()
              ProfileAuditEvent.__table__.drop(db.engine, checkfirst=True)
              ClientProfile.__table__.drop(db.engine, checkfirst=True)
              with db.engine.begin() as connection:
                  connection.execute(
                      text(
                          "CREATE TABLE alembic_version "
                          "(version_num VARCHAR(32) NOT NULL)"
                      )
                  )
                  connection.execute(
                      text(
                          "INSERT INTO alembic_version (version_num) "
                          "VALUES ('82c0c175b392')"
                      )
                  )
          PY
          python scripts/reconcile_alembic_history.py
          python -m flask db upgrade d42e7a1c9b50
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine("sqlite:////tmp/aura-schema-drift.db")
          tables = set(inspect(engine).get_table_names())
          required = {
              "maintenance_schedules",
              "vehicle_recalls",
              "user_sessions",
              "client_profiles",
              "profile_audit_events",
              "alembic_version",
          }
          missing = required - tables
          if missing:
              raise SystemExit(
                  f"Schema reconciliation missing tables: {sorted(missing)}"
              )

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if version != "d42e7a1c9b50":
              raise SystemExit(f"Unexpected reconciled head: {version}")

          print("Production schema reconciliation rehearsal passed through d42e7a1c9b50.")
          PY

      - name: Rehearse production session and profile migrations
        env:
          SQLALCHEMY_DATABASE_URI: "sqlite:////tmp/aura-migration-test.db"
        run: |
          rm -f /tmp/aura-migration-test.db
          python - <<'PY'
          from app import create_app
          from extensions import db
          from profiles.models import ClientProfile, ProfileAuditEvent
          from security.session_registry import UserSession

          app = create_app()
          with app.app_context():
              db.create_all()
              ProfileAuditEvent.__table__.drop(db.engine, checkfirst=True)
              ClientProfile.__table__.drop(db.engine, checkfirst=True)
              UserSession.__table__.drop(db.engine, checkfirst=True)
          PY
          python -m flask db stamp 4d2b9e7a1c60
          python -m flask db upgrade d42e7a1c9b50
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine("sqlite:////tmp/aura-migration-test.db")
          tables = set(inspect(engine).get_table_names())
          required = {
              "users",
              "user_sessions",
              "client_profiles",
              "profile_audit_events",
              "alembic_version",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Migration rehearsal missing tables: {sorted(missing)}")

          with engine.connect() as connection:
              version = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

          if version != "d42e7a1c9b50":
              raise SystemExit(f"Unexpected migration head: {version}")

          print("Production session and profile migration rehearsal passed through d42e7a1c9b50.")
          PY

      - name: Test security foundation
        run: pytest -q --tb=short tests/test_security_foundation.py

      - name: Test sensitive-route rate limiting
        run: pytest -q --tb=short tests/test_rate_limits.py

      - name: Test email verification
        id: email_verification_tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short tests/test_email_verification.py 2>&1 | tee email-verification-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Post email verification failure to PR
        if: always() && steps.email_verification_tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f email-verification-output.txt ]; then
            {
              echo "### Aura email verification test failure"
              echo
              echo '```text'
              tail -n 180 email-verification-output.txt
              echo '```'
            } > email-verification-comment.md
            gh pr comment "$PR_URL" --body-file email-verification-comment.md
          fi

      - name: Test client profile encryption and integrity
        run: pytest -q --tb=short tests/test_client_profile_model.py

      - name: Test client profile self-service
        shell: bash
        run: |
          set +e
          pytest -q --tb=short tests/test_client_profile_routes.py 2>&1 | tee client-profile-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Post client profile failure to PR
        if: always() && failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f client-profile-output.txt ]; then
            {
              echo "### Aura client profile test failure"
              echo
              echo '```text'
              tail -n 180 client-profile-output.txt
              echo '```'
            } > client-profile-comment.md
            gh pr comment "$PR_URL" --body-file client-profile-comment.md
          fi

      - name: Test session registry and revocation
        shell: bash
        run: |
          set +e
          pytest -q --tb=short tests/test_session_registry.py 2>&1 | tee session-registry-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Post session registry failure to PR
        if: always() && failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f session-registry-output.txt ]; then
            {
              echo "### Aura session registry test failure"
              echo
              echo '```text'
              tail -n 180 session-registry-output.txt
              echo '```'
            } > session-registry-comment.md
            gh pr comment "$PR_URL" --body-file session-registry-comment.md
          fi

      - name: Test owner driver management authorization
        run: pytest -q --tb=short tests/test_owner_driver_management.py

      - name: Test canonical event emission
        run: pytest -q --tb=short tests/test_event_emission.py

      - name: Run Ruff on security changes
        run: ruff check --output-format=concise app.py auth/routes.py driver/routes.py events/routes.py ownership/routes.py profiles security services/email_delivery.py services/owner_driver_management.py services/event_emission.py scripts tests

      - name: Run Bandit on security changes
        id: bandit_tests
        shell: bash
        run: |
          set +e
          bandit -q -r app.py auth driver events ownership profiles security scripts -x ./tests 2>&1 | tee bandit-output.txt
          status=${PIPESTATUS[0]}
          bandit -q services/email_delivery.py services/owner_driver_management.py services/event_emission.py 2>&1 | tee -a bandit-output.txt
          service_status=${PIPESTATUS[0]}
          if [ "$service_status" -ne 0 ]; then
            status="$service_status"
          fi
          exit "$status"

      - name: Post Bandit failure to PR
        if: always() && steps.bandit_tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f bandit-output.txt ]; then
            {
              echo "### Aura Bandit failure"
              echo
              echo '```text'
              tail -n 180 bandit-output.txt
              echo '```'
            } > bandit-comment.md
            gh pr comment "$PR_URL" --body-file bandit-comment.md
          fi

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
